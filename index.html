<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vista Curriculum | Perfil de Usuario</title>
    <meta
      name="description"
      content="Gestión y edición del perfil profesional y currículum vitae de Iván Del Toro Haro."
    />
    <meta name="author" content="Iván Del Toro Haro" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="contenido-principal">
      <button type="button" class="volver">&lt; Volver</button>
      <p class="ruta-perfil">Perfil</p>
      <h1>Tu historia, bien presentada.</h1>

      <section class="resumen-perfil" aria-label="Resumen del perfil">
        <article class="tarjeta-perfil">
          <figure>
            <img
              src="img/icon.png"
              alt="Fotografía de perfil de Iván Del Toro Haro"
              width="100"
              height="100"
              loading="lazy"
            />
            <figcaption>
              Imagen del perfil dentro del apartado currículum
            </figcaption>
          </figure>
          <h2>Iván Del Toro Haro</h2>
          <p>Estudiante · 2º DAW</p>
          <button type="button" class="boton-mis-datos">Mis datos</button>
          <button type="button">Mi CV</button>
        </article>
      </section>

      <section class="resumen-curriculum">
        <div class="acciones-titulo-curriculum">
          <h2>CURRÍCULUM</h2>
          <button type="button" class="añadir">Añadir objeto</button>
        </div>
        <h3>Experiencia y formación</h3>
        <p>
          Arrastra las tarjetas para cambiar el orden en el que aparecerán en tu
          CV final.
        </p>
        <div class="barra-herramientas">
          <button type="button" class="subir-archivo">Subir archivo</button>
          <button type="button" class="descargar-cv">Descargar CV</button>
        </div>
      </section>

      <section class="experiencia-cv">
        <h2>EXPERIENCIA</h2>
        <form action="#" method="post">
          <div class="grupo-formulario">
            <label for="experiencia">Puesto o experiencia</label>
            <input type="text" id="experiencia" name="experiencia" />
          </div>
          <div class="grupo-formulario">
            <label for="empresa">Empresa y detalles</label>
            <input type="text" id="empresa" name="empresa" />
          </div>
          <div class="grupo-formulario fechas-experiencia">
            <div class="campo-fecha">
              <label for="fecha-desde">Fecha desde</label>
              <input type="date" id="fecha-desde" name="fecha-desde" />
            </div>
            <div class="campo-fecha">
              <label for="fecha-hasta">Fecha hasta</label>
              <input type="date" id="fecha-hasta" name="fecha-hasta" />
            </div>
          </div>
          <div class="acciones-formulario">
            <button type="button" class="cancelar">Cancelar</button>
            <button type="button" class="añadir">Guardar información</button>
          </div>
        </form>
      </section>

      <section class="formacion-cv">
        <h2>FORMACIÓN</h2>
        <form action="#" method="post">
          <div class="grupo-formulario">
            <label for="estudios">Estudios o formación</label>
            <input type="text" id="estudios" name="estudios" />
          </div>
          <div class="grupo-formulario">
            <label for="centro">Centro y detalles</label>
            <input type="text" id="centro" name="centro" />
          </div>
          <div class="acciones-formulario">
            <button type="button" class="cancelar">Cancelar</button>
            <button type="button" class="añadir">Guardar información</button>
          </div>
        </form>
      </section>

      <section class="aptitudes-cv">
        <h2>APTITUDES</h2>
        <form action="#" method="post">
          <div class="grupo-formulario">
            <label for="aptitud">Aptitud o habilidad</label>
            <input type="text" id="aptitud" name="aptitud" />
          </div>
          <div class="grupo-formulario">
            <label for="nivel">Nivel o detalles</label>
            <input type="text" id="nivel" name="nivel" />
          </div>
          <div class="acciones-formulario">
            <button type="button" class="cancelar">Cancelar</button>
            <button type="button" class="añadir">Guardar información</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="pie-pagina">
      <p>&copy; 2026 Iván Del Toro Haro. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
