<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vista Curriculum</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Ir al inicio">
        <img
          src="img/altair-centro-educativo.png"
          alt="Altair Centro Educativo"
        />
      </a>

      <nav class="desktop-nav" aria-label="Navegación principal">
        <a href="#">Inicio</a>
        <a href="#">Horario</a>
        <a href="#">Faltas</a>
        <a href="#">Tutoría</a>
        <a class="active" href="#">Mi perfil</a>
      </nav>

      <div class="header-actions">
        <span class="term-pill">Curso 26/27</span>

        <a class="avatar-button" href="#" aria-label="Ver perfil">
          <img src="img/icon.png" alt="" />
        </a>

        <button class="icon-button" type="button" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <p>&lt; Volver</p>
      <p>Perfil</p>
      <h2>Tu historia, bien presentada.</h2>

      <section style="border: 1px black solid; padding: 10px; margin-bottom: 10px;">
        <figure>
          <img src="img/icon.png" alt="Icono de perfil" width="100" height="100" />
          <figcaption>Imagen del perfil dentro del apartado curriculum</figcaption>
        </figure>
        <p>Iván Del Toro Haro</p>
        <p>Estudiante · 2ºDAW </p>
        <button style="margin-bottom: 10px;">Mis datos</button>
        <br>
        <button>Mi CV</button>
      </section>

      <section style="border: 1px black solid; padding: 10px; margin-bottom: 10px;">
        <button style="float: right; width: 150px; height: 40px;">&plus; Añadir objeto</button>
        <p>CURRÍCULUM</p> 
        <p>Experiencia y formación</p>
        <p>Arrastra las tarjetas para cambiar el orden en el que aparecerán en tu CV.</p>
        <button style="float: right;">&uparrow; Subir archivo</button>
        <button style="float: right;">&downarrow; Descargar CV</button>
        <br>
      </section>

      <section style="border: 1px black solid; padding: 10px; margin-bottom: 10px;">
        
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
